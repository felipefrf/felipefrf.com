<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAlvo · Prontuário final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== tokens (ver TOKENS.md) ===== */
html[data-theme=dark]{
  --board:#080B10;
  --bg:#11161D; --bg-2:#141A22;
  --app:radial-gradient(1100px 520px at 78% -8%,rgba(110,125,245,.06),transparent 62%),linear-gradient(180deg,#131922 0%,#11161D 55%);
  --side:#0D1218;
  --c1:#171D26; --c2:#151B23; --raised:#1E2631; --sunken:#0F141A;
  --line:rgba(190,205,230,.09); --line-2:rgba(190,205,230,.16); --track:rgba(190,205,230,.10);
  --tx:#E4E8EE; --tx-2:#AAB3C0; --tx-3:#8E99AA;
  --act:#4E5DE4; --act-2:#4352D6; --act-ink:#FFFFFF; --act-tx:#9AA5FA; --act-soft:rgba(110,125,245,.14); --act-line:rgba(130,145,250,.42);
  --ok:#45B67F; --ok-ink:#05200F; --ok-tx:#5CCB93; --ok-soft:rgba(69,182,127,.13); --ok-line:rgba(69,182,127,.45);
  --bad:#E5716A; --bad-ink:#2B0907; --bad-tx:#F29A94; --bad-soft:rgba(229,113,106,.13); --bad-line:rgba(229,113,106,.45);
  --amber:#E3B45A; --amber-tx:#EDC77A; --peach:#F0AE8C; --peach-tx:#F5BFA3; --coral:#EE8A66; --coral-tx:#F4A285;
  --warm-soft:rgba(240,150,110,.11); --warm-line:rgba(240,150,110,.26);
  --zone-dn:#8E99AA;
  --cli:#5FA8E8; --cir:#AE8EEA; --ped:#4FC3D6; --go:#E67BAA; --pre:#93C062;
  --sh:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.5);
  --sh-lo:inset 0 1px 0 rgba(255,255,255,.03),0 1px 2px rgba(0,0,0,.25);
  --sh-sheet:0 -16px 40px -12px rgba(0,0,0,.6);
  --chip:rgba(190,205,230,.05); --tab:rgba(17,22,29,.92); --scrim:rgba(5,8,12,.62);
  --av0:#2B3A55; --av1:#2E4560; --av2:#3E3A5E; --av3:#2A4A52; --av4:#4A4038; --av5:#2C4660; --av6:#4A3646; --av7:#34485A;
}
html[data-theme=light]{
  --board:#E3E8EF;
  --bg:#F5F7FA; --bg-2:#EFF2F6;
  --app:linear-gradient(180deg,#F6F8FB 0%,#F3F5F9 60%);
  --side:#EFF2F6;
  --c1:#FFFFFF; --c2:#FCFDFE; --raised:#FFFFFF; --sunken:#EEF1F5;
  --line:rgba(16,32,64,.10); --line-2:rgba(16,32,64,.17); --track:rgba(16,32,64,.08);
  --tx:#0E1726; --tx-2:#435066; --tx-3:#5B677C;
  --act:#3A4CCB; --act-2:#3142B5; --act-ink:#FFFFFF; --act-tx:#3343C2; --act-soft:rgba(58,76,203,.08); --act-line:rgba(58,76,203,.42);
  --ok:#1C7F52; --ok-ink:#FFFFFF; --ok-tx:#17704A; --ok-soft:rgba(28,127,82,.08); --ok-line:rgba(28,127,82,.45);
  --bad:#BC3A33; --bad-ink:#FFFFFF; --bad-tx:#A9302A; --bad-soft:rgba(188,58,51,.07); --bad-line:rgba(188,58,51,.48);
  --amber:#D99A2B; --amber-tx:#7A5000; --peach:#EFA17C; --peach-tx:#8F4220; --coral:#E3704D; --coral-tx:#9A361A;
  --warm-soft:rgba(227,112,77,.08); --warm-line:rgba(227,112,77,.26);
  --zone-dn:#5B677C;
  --cli:#1F6CB0; --cir:#6D45C2; --ped:#0B7486; --go:#B0397A; --pre:#4A7A1A;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --sh-lo:0 1px 2px rgba(16,24,40,.06);
  --sh-sheet:0 -16px 40px -12px rgba(16,24,40,.22);
  --chip:rgba(16,32,64,.04); --tab:rgba(250,251,253,.92); --scrim:rgba(14,23,38,.42);
  --av0:#D6E0F0; --av1:#D3E2EE; --av2:#E2DDF2; --av3:#D4E6EA; --av4:#EEE2D4; --av5:#DCE6EC; --av6:#EED8E2; --av7:#DCE3F2;
}
:root{--pine-1:#1C2338;--pine-2:#121726;--ptx:#EEF1F8;--ptx-2:#B4BCD0;--pact:#4E5DE4;--pink:#FFFFFF;--online:#2FB574;--mono:"Geist Mono",ui-monospace,monospace}
body{background:var(--board);color:var(--tx);font:450 14px/1.45 Geist,system-ui,sans-serif;font-feature-settings:"ss01";-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.num[style*="font-size:3"],.num[style*="font-size:4"],.num[style*="font-size:5"],.num[style*="font-size:7"]{font-family:Geist,sans-serif;font-weight:600;letter-spacing:-.04em}

/* página */
.page{width:max-content;padding:40px 48px 72px}
.ptop{display:flex;align-items:center;justify-content:space-between;width:1878px;margin-bottom:40px}
.ptop h1{font:600 22px Geist;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.ptop h1 small{font:500 14px Geist;color:var(--tx-3);letter-spacing:0}
.toggle{display:flex;background:var(--c1);border:1px solid var(--line-2);border-radius:9px;padding:4px;box-shadow:var(--sh-lo)}
.toggle button{font:600 13px Geist;color:var(--tx-2);background:none;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--raised);color:var(--tx);box-shadow:var(--sh-lo)}
section.scr{margin-bottom:64px}
.scr>h2{font:600 18px Geist;letter-spacing:-.02em;margin-bottom:16px;display:flex;gap:10px;align-items:baseline}
.scr>h2 span{color:var(--tx-3);font:600 13px Geist}
.row{display:flex;gap:48px;align-items:flex-start}
.lbl{font:600 11.5px Geist;color:var(--tx-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.frame{position:relative;overflow:hidden;background:var(--bg);background-image:var(--app);box-shadow:0 0 0 1px var(--line-2),0 40px 90px -40px rgba(0,0,0,.55)}
.desk{width:1440px;height:900px;border-radius:12px;display:flex}
.mob{width:390px;height:844px;border-radius:46px;display:flex;flex-direction:column}

/* barra lateral */
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px 18px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 24px;font:600 18px Geist;letter-spacing:-.025em}
.logo i{font:400 italic 25px Geist,sans-serif;letter-spacing:0;color:var(--act-tx);margin-left:-7px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:var(--tx-2);font-weight:550;font-size:14.5px;text-decoration:none;margin-bottom:2px}
.nav a svg{color:var(--tx-3)}
.nav a.cur{background:var(--c1);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-lo)}
.nav a.cur svg{color:var(--act-tx)}
.nav a b{margin-left:auto;font:500 11.5px var(--mono);background:var(--warm-soft);color:var(--coral-tx);padding:1px 7px;border-radius:5px}
.me{margin-top:auto;padding:14px;border-radius:10px;background:var(--c1);border:1px solid var(--line);box-shadow:var(--sh-lo)}
.me .t{display:flex;gap:11px;align-items:center}
.me .n{font-weight:600;font-size:14px}
.me .s{font-size:12px;color:var(--tx-3)}
.pro{font:650 10px Geist;letter-spacing:.06em;color:#3A2400;background:linear-gradient(180deg,#F8D88C,#E9AE45);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.xp{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);margin:12px 0 6px}
.xp b{color:var(--tx-2);font-weight:600}

/* blocos */
.main{flex:1;min-width:0;padding:28px 36px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--c1);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.pad{padding:22px 24px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ct h3{font:550 15.5px Geist;letter-spacing:-.005em;display:flex;align-items:center;gap:9px}
.ct .r{font-size:12.5px;color:var(--tx-3);font-weight:550;display:flex;align-items:center;gap:5px}
.lnk{color:var(--act-tx);font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;min-height:32px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:7px;background:var(--chip);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--tx-2);white-space:nowrap}
.chip .num{color:var(--tx);font-size:14px;letter-spacing:-.02em}
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit}
.warm{background:linear-gradient(90deg,var(--amber),var(--peach) 60%,var(--coral))}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:9px;font:600 15px Geist;border:0;white-space:nowrap;text-decoration:none}
.btn-p{color:var(--act-ink);background:var(--act);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 2px rgba(16,24,60,.25),0 6px 14px -8px color-mix(in srgb,var(--act) 70%,transparent)}

.btn-s{color:var(--tx);background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--sh-lo)}
.btn-pine{color:var(--pink);background:var(--pact);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.3),0 8px 18px -8px rgba(78,93,228,.7)}
.btn-ghost-pine{color:var(--ptx);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:7px;font:600 13px Geist;color:var(--tx-2);white-space:nowrap}
.seg span.sel{background:var(--raised);color:var(--tx);box-shadow:var(--sh-lo),inset 0 0 0 1px var(--line-2)}
.fchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--c1);font:600 13px Geist;color:var(--tx-2);white-space:nowrap}
.fchip.sel{background:var(--act-soft);border-color:var(--act-line);color:var(--tx)}
.fchip.sel svg{color:var(--act-tx)}
.fchip .n{font:500 12px var(--mono);color:var(--tx-3);letter-spacing:-.03em}

/* pinho */
.pine{background:radial-gradient(520px 300px at 88% 0%,rgba(120,135,255,.16),transparent 60%),linear-gradient(150deg,var(--pine-1),var(--pine-2));color:var(--ptx);border:1px solid rgba(170,185,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.18),0 20px 44px -18px rgba(8,30,22,.6)}
.deco{position:absolute;pointer-events:none}
.pseg{display:flex;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:3px}
.pseg span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;font:600 13px Geist;color:var(--ptx-2);white-space:nowrap}
.pseg span.sel{background:rgba(255,255,255,.14);color:var(--ptx);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

/* avatar */
.av{position:relative;display:inline-block;flex:none;line-height:0}
.av svg.face{border-radius:50%;display:block}
.av .onl{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:10px;min-height:10px;max-width:20px;max-height:20px;border-radius:50%;background:var(--online);border:2.5px solid var(--bgc,var(--c1))}
.av .selo{position:absolute;right:-6px;top:-5px;width:40%;height:40%;min-width:18px;min-height:18px;max-width:30px;max-height:30px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 1.5px var(--line-2),0 2px 4px rgba(0,0,0,.25);display:grid;place-items:center}
.ini{display:grid;place-items:center;border-radius:50%;font-family:Geist;font-weight:600;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);letter-spacing:-.02em}

/* liga */
.lrow{display:grid;grid-template-columns:34px 40px 1fr 96px;align-items:center;gap:14px;height:46px;padding:0 18px;border-radius:8px}
.lrow .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sub{font-size:12.5px;color:var(--tx-3);font-weight:600}
.lrow .x{text-align:right;font-size:15px}
.lrow .x small{font:500 11px Geist;color:var(--tx-3);margin-left:3px;letter-spacing:0}
.rk{width:30px;height:30px;display:grid;place-items:center;font:500 13.5px var(--mono);color:var(--tx-2)}
.rk.m{border-radius:50%;color:#2A1B05;font-size:12.5px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.25)}
.lrow.you{background:var(--act-soft);box-shadow:inset 3px 0 0 var(--act),inset 0 0 0 1px var(--act-line)}
.zone{display:flex;align-items:center;gap:10px;margin:2px 18px;font:600 11.5px Geist;letter-spacing:.06em;text-transform:uppercase;height:24px}
.zone:before,.zone:after{content:"";height:1px;flex:1;background:currentColor;opacity:.35}
.zone.up{color:var(--ok-tx)} .zone.dn{color:var(--zone-dn)}
.zone span{display:inline-flex;gap:6px;align-items:center}
.collapse{display:flex;align-items:center;justify-content:center;gap:8px;height:36px;margin:2px 18px;border-radius:7px;border:1px dashed var(--line-2);font:600 12.5px Geist;color:var(--tx-2)}

/* questão */
.alt{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--c1);position:relative}
.alt .L{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:500 14px var(--mono);background:var(--chip);color:var(--tx-2);border:1px solid var(--line-2)}
.alt .tx{font-size:16px;line-height:1.5;color:var(--tx-2)}
.alt .pc{display:flex;align-items:center;gap:8px;font:500 12.5px var(--mono);color:var(--tx-3)}
.alt .pc i{width:44px;height:5px;border-radius:3px;background:var(--track);overflow:hidden;display:block}
.alt .pc i b{display:block;height:100%;background:var(--tx-3)}
.alt.ok{border-color:var(--ok-line);background:var(--ok-soft)}
.alt.ok .L{background:var(--ok);color:var(--ok-ink);border-color:transparent}
.alt.ok .tx{color:var(--tx);font-weight:550}
.alt.ok .pc i b{background:var(--ok)}
.alt.no{border-color:var(--bad-line);background:var(--bad-soft)}
.alt.no .L{background:var(--bad);color:var(--bad-ink);border-color:transparent}
.alt.no .tx{color:var(--tx)}
.alt.no .pc i b{background:var(--bad)}
.tag{font:600 10.5px Geist;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:var(--ok-soft);color:var(--ok-tx);box-shadow:inset 0 0 0 1px var(--ok-line)} .tag.no{background:var(--bad-soft);color:var(--bad-tx);box-shadow:inset 0 0 0 1px var(--bad-line)}
.abtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:8px;color:var(--tx-2);font-weight:600;font-size:13.5px}
.abtn svg{color:var(--tx-3)}
.th{font:600 11.5px Geist;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-3)}

/* celular */
.sbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font:600 15px Geist;color:var(--tx)}
.sbar .ic{display:flex;gap:6px;align-items:center}
.mbody{flex:1;overflow:hidden;padding:6px 16px 110px;display:flex;flex-direction:column;gap:14px}
.mbody>*{flex-shrink:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--tab);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 26px;z-index:3}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px Geist;color:var(--tx-3);text-decoration:none;min-height:48px}
.tabbar a.cur{color:var(--tx)}
.tabbar a.cur svg{color:var(--act-tx)}
.tabbar a .pill{width:52px;height:30px;border-radius:8px;display:grid;place-items:center}
.tabbar a.cur .pill{background:var(--act-soft)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:var(--tx);opacity:.35;z-index:6}
.mcard{border-radius:12px}
.mpad{padding:16px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--c1);border-radius:18px 18px 0 0;border-top:1px solid var(--line-2);box-shadow:var(--sh-sheet);padding:10px 16px 34px}
.grab{width:36px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 12px}
.chk{width:24px;height:24px;border-radius:6px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.chk.on{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.field{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;background:var(--sunken);border:1px solid var(--line-2);color:var(--tx-3);font-weight:600;font-size:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <clipPath id="avc" clipPathUnits="userSpaceOnUse"><circle cx="32" cy="32" r="32"/></clipPath>
  <linearGradient id="rim-bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4C49B"/><stop offset=".45" stop-color="#C47A4A"/><stop offset="1" stop-color="#7A3F1E"/></linearGradient>
  <linearGradient id="en-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9764A"/><stop offset="1" stop-color="#7D3A1C"/></linearGradient>
  <linearGradient id="rim-prata" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#B8C3CC"/><stop offset="1" stop-color="#6E7C88"/></linearGradient>
  <linearGradient id="en-prata" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FB0BE"/><stop offset="1" stop-color="#4F6070"/></linearGradient>
  <linearGradient id="rim-ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0BC"/><stop offset=".45" stop-color="#E9B23C"/><stop offset="1" stop-color="#9A6110"/></linearGradient>
  <linearGradient id="en-ouro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B947"/><stop offset="1" stop-color="#A9670C"/></linearGradient>
  <linearGradient id="rim-diam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8FBFF"/><stop offset=".45" stop-color="#8FD3EA"/><stop offset="1" stop-color="#3B87AA"/></linearGradient>
  <linearGradient id="en-diam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FC9E6"/><stop offset="1" stop-color="#1F6A99"/></linearGradient>
  <linearGradient id="en-jade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C89F0"/><stop offset="1" stop-color="#3241B0"/></linearGradient>
  <linearGradient id="en-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA6F2"/><stop offset="1" stop-color="#28529A"/></linearGradient>
  <linearGradient id="en-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A68BF0"/><stop offset="1" stop-color="#523A9E"/></linearGradient>
