<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAlvo · Residência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html[data-theme=dark]{
  --board:#09110F;
  --bg:#0F1A17; --bg-2:#15241F;
  --app:radial-gradient(1100px 520px at 78% -8%, rgba(70,214,162,.075), transparent 62%), linear-gradient(180deg,#12211C 0%,#0F1A17 55%);
  --side:linear-gradient(180deg,#13231E,#0E1815);
  --c1:#1B2E28; --c2:#162621; --raised:#21372F;
  --line:rgba(196,236,219,.075); --line-2:rgba(196,236,219,.13);
  --track:rgba(196,236,219,.09);
  --tx:#E7F0EB; --tx-2:#A9BDB4; --tx-3:#82988F;
  --act:#3FD3A0; --act-2:#2DB988; --act-ink:#04261A; --act-tx:#5BE0B1; --act-soft:rgba(63,211,160,.13);
  --prog:#F2BC4E; --prog-tx:#F5C766; --prog-soft:rgba(242,188,78,.14);
  --bad:#F2706B; --bad-tx:#F68A85; --bad-soft:rgba(242,112,107,.12);
  --cli:#7BB1F8; --cir:#B49DF7; --ped:#F5A07F; --go:#EC86BF; --pre:#A6D56E;
  --sh:inset 0 1px 0 rgba(255,255,255,.045), 0 1px 2px rgba(0,0,0,.35), 0 10px 24px -10px rgba(0,0,0,.5), 0 28px 56px -28px rgba(0,0,0,.55);
  --sh-lo:inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.3);
  --chip:rgba(196,236,219,.06);
  --tab:rgba(14,25,22,.86);
}
html[data-theme=light]{
  --board:#D6E1DB;
  --bg:#EEF4F0; --bg-2:#E6EEE9;
  --app:radial-gradient(1100px 520px at 78% -8%, rgba(18,140,104,.07), transparent 62%), linear-gradient(180deg,#F2F7F4 0%,#EBF2EE 60%);
  --side:linear-gradient(180deg,#E7EFEA,#E1EAE5);
  --c1:#FBFDFC; --c2:#F4F8F6; --raised:#FDFEFD;
  --line:rgba(18,58,44,.08); --line-2:rgba(18,58,44,.14);
  --track:rgba(18,58,44,.08);
  --tx:#0F231C; --tx-2:#44605A; --tx-3:#5C736B;
  --act:#0E8562; --act-2:#0A7253; --act-ink:#FFFFFF; --act-tx:#0B7556; --act-soft:rgba(14,133,98,.10);
  --prog:#E2A12E; --prog-tx:#8E5E06; --prog-soft:rgba(226,161,46,.15);
  --bad:#D2483F; --bad-tx:#B83A32; --bad-soft:rgba(210,72,63,.09);
  --cli:#2F73CF; --cir:#7556D2; --ped:#CF5F38; --go:#BE4386; --pre:#4F8C1F;
  --sh:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(18,58,44,.06), 0 8px 18px -8px rgba(18,58,44,.12), 0 22px 44px -24px rgba(18,58,44,.18);
  --sh-lo:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(18,58,44,.07);
  --chip:rgba(18,58,44,.05);
  --tab:rgba(246,250,248,.9);
}
:root{--pine-1:#1E4034;--pine-2:#10241D;--ptx:#EAF5EF;--ptx-2:#A9C8BB;--pact:#46D9A6;--pink:#04261A}
body{background:var(--board);color:var(--tx);font:500 14px/1.45 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s}
.num{font-family:Sora,Manrope,sans-serif;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* página */
.page{width:max-content;padding:40px 48px 72px}
.ptop{display:flex;align-items:center;justify-content:space-between;width:1878px;margin-bottom:40px}
.ptop h1{font:600 22px Sora;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.ptop h1 small{font:500 14px Manrope;color:var(--tx-3);letter-spacing:0}
.toggle{display:flex;background:var(--c2);border:1px solid var(--line-2);border-radius:12px;padding:4px;box-shadow:var(--sh-lo)}
.toggle button{font:700 13px Manrope;color:var(--tx-2);background:none;border:0;padding:9px 18px;border-radius:9px;cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--raised);color:var(--tx);box-shadow:var(--sh-lo)}
section.scr{margin-bottom:64px}
.scr>h2{font:600 18px Sora;letter-spacing:-.02em;margin-bottom:16px;display:flex;gap:10px;align-items:baseline}
.scr>h2 span{color:var(--tx-3);font:600 13px Manrope}
.row{display:flex;gap:48px;align-items:flex-start}
.lbl{font:700 11.5px Manrope;color:var(--tx-3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.frame{position:relative;overflow:hidden;background:var(--bg);background-image:var(--app);box-shadow:0 0 0 1px var(--line-2),0 40px 90px -40px rgba(0,0,0,.55)}
.desk{width:1440px;height:900px;border-radius:14px;display:flex}
.mob{width:390px;height:844px;border-radius:46px;display:flex;flex-direction:column}

/* barra lateral */
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px 18px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 26px;font:800 21px Manrope;letter-spacing:-.02em}
.logo i{font:400 italic 25px 'Instrument Serif',serif;letter-spacing:0;color:var(--act-tx);margin-left:-7px}
.nav a{display:flex;align-items:center;gap:13px;height:44px;padding:0 12px;border-radius:12px;color:var(--tx-2);font-weight:650;font-size:14.5px;text-decoration:none;margin-bottom:2px}
.nav a svg{color:var(--tx-3)}
.nav a.on{background:var(--act-soft);color:var(--tx);box-shadow:inset 0 0 0 1px rgba(63,211,160,.14)}
.nav a.on svg{color:var(--act-tx)}
.nav a b{margin-left:auto;font:700 11.5px Manrope;background:var(--prog-soft);color:var(--prog-tx);padding:2px 8px;border-radius:99px}
.me{margin-top:auto;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);box-shadow:var(--sh-lo)}
.me .t{display:flex;gap:11px;align-items:center}
.me .n{font-weight:750;font-size:14px}
.me .s{font-size:12px;color:var(--tx-3)}
.pro{font:800 10px Manrope;letter-spacing:.06em;color:var(--pink);background:linear-gradient(180deg,#F6D27E,#E2A12E);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.xp{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);margin:12px 0 6px}
.xp b{color:var(--tx-2);font-weight:700}

/* blocos */
.main{flex:1;min-width:0;padding:28px 36px;display:flex;flex-direction:column;gap:20px}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.pad{padding:22px 24px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ct h3{font:650 15.5px Manrope;letter-spacing:-.005em;display:flex;align-items:center;gap:9px}
.ct .r{font-size:12.5px;color:var(--tx-3);font-weight:600}
.lnk{color:var(--act-tx);font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--tx-2);white-space:nowrap}
.chip .num{color:var(--tx);font-size:14px;letter-spacing:-.02em}
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:14px;font:750 15px Manrope;border:0;white-space:nowrap;text-decoration:none}
.btn-p{color:var(--act-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--act) 82%,white),var(--act) 55%,var(--act-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.2),0 10px 22px -10px color-mix(in srgb,var(--act) 80%,transparent)}
.btn-s{color:var(--tx);background:linear-gradient(180deg,var(--raised),var(--c2));border:1px solid var(--line-2);box-shadow:var(--sh-lo)}
.btn-pine{color:var(--pink);background:linear-gradient(180deg,#7BEBC4,var(--pact) 55%,#2FBF8D);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 26px -10px rgba(70,217,166,.55)}

/* cartão pinho (herói) — igual nos dois temas */
.pine{background:radial-gradient(520px 300px at 88% 0%,rgba(70,217,166,.20),transparent 60%),linear-gradient(150deg,var(--pine-1),var(--pine-2));color:var(--ptx);border:1px solid rgba(160,240,205,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.18),0 20px 44px -18px rgba(8,30,22,.6)}
.pine .deco{position:absolute;pointer-events:none}

/* avatar */
.avw{position:relative;display:inline-block;flex:none}
.av{display:block;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.av svg{display:block;width:100%;height:100%}
.onl{position:absolute;right:0;bottom:1px;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:#43D68F;box-shadow:0 0 0 2.5px var(--c1)}
.bdg{position:absolute;top:-3px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--c1);display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--line-2),0 2px 4px rgba(0,0,0,.25)}

/* liga */
.lrow{display:grid;grid-template-columns:40px 44px 1fr auto 96px;align-items:center;gap:14px;height:54px;padding:0 18px;border-radius:14px}
.lrow .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sub{font-size:12.5px;color:var(--tx-3);font-weight:600}
.lrow .x{text-align:right;font-size:15px}
.lrow .x small{font:600 11.5px Manrope;color:var(--tx-3);margin-left:3px;letter-spacing:0}
.rk{width:30px;height:30px;display:grid;place-items:center;font:700 14px Sora;color:var(--tx-2)}
.rk.m{border-radius:50%;color:#2A1B05;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.25)}
.lrow.you{background:linear-gradient(90deg,var(--act-soft),transparent 90%);box-shadow:inset 0 0 0 1px rgba(63,211,160,.25)}
.zone{display:flex;align-items:center;gap:10px;margin:6px 18px;font:700 11.5px Manrope;letter-spacing:.06em;text-transform:uppercase}
.zone:before,.zone:after{content:"";height:1px;flex:1;background:currentColor;opacity:.35}
.zone.up{color:var(--act-tx)} .zone.dn{color:var(--bad-tx)}
.zone span{display:inline-flex;gap:6px;align-items:center}

/* questão */
.alt{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--c2);position:relative;overflow:hidden}
.alt .L{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 14px Sora;background:var(--chip);color:var(--tx-2);border:1px solid var(--line)}
.alt .tx{font-size:14.5px;line-height:1.45;color:var(--tx-2);position:relative}
.alt .pc{font:600 12.5px Sora;color:var(--tx-3);position:relative}
.alt .fill{position:absolute;left:0;top:0;bottom:0;background:var(--track);opacity:.6}
.alt.ok{border-color:color-mix(in srgb,var(--act) 55%,transparent);background:linear-gradient(90deg,var(--act-soft),var(--c2))}
.alt.ok .L{background:var(--act);color:var(--act-ink);border-color:transparent}
.alt.ok .tx{color:var(--tx);font-weight:650}
.alt.no{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:linear-gradient(90deg,var(--bad-soft),var(--c2))}
.alt.no .L{background:var(--bad);color:#fff;border-color:transparent}
.alt.no .tx{color:var(--tx)}
.tag{font:750 10.5px Manrope;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.ok{background:var(--act-soft);color:var(--act-tx)} .tag.no{background:var(--bad-soft);color:var(--bad-tx)}
.abtn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;color:var(--tx-2);font-weight:700;font-size:13.5px;border:1px solid transparent}
.abtn svg{color:var(--tx-3)}
.abtn.curo{color:var(--tx);background:var(--act-soft);border-color:rgba(63,211,160,.18)}
.abtn.curo svg{color:var(--act-tx)}

/* celular */
.sbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font:700 15px Manrope;color:var(--tx)}
.sbar .ic{display:flex;gap:6px;align-items:center}
.mbody{flex:1;overflow:hidden;padding:6px 16px 110px;display:flex;flex-direction:column;gap:14px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--tab);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 26px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 11px Manrope;color:var(--tx-3);text-decoration:none;min-height:48px;border-radius:14px}
.tabbar a.on{color:var(--tx)}
.tabbar a.on svg{color:var(--act-tx)}
.tabbar a .pill{width:56px;height:30px;border-radius:99px;display:grid;place-items:center}
.tabbar a.on .pill{background:var(--act-soft)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:var(--tx);opacity:.35}
.mcard{border-radius:20px}
.mbody>*{flex-shrink:0}
.mpad{padding:16px}
</style>
</head>

  <linearGradient id="iceG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDEBFF"/><stop offset="1" stop-color="#4AA6D6"/></linearGradient>
</defs>
</svg>

<div class="page">
  <div class="ptop">
    <h1>MedAlvo · Residência <small>pinho profundo, cartões com volume, alvo como motivo · tema principal: escuro</small></h1>
    <div class="toggle" role="group" aria-label="Tema">
      <button data-t="dark" aria-pressed="true">Escuro</button>
      <button data-t="light" aria-pressed="false">Claro</button>
    </div>
  </div>
  <div id="screens"></div>
</div>

  return `<nav class="tabbar">${t.map(([k,l])=>`<a class="${k===active?'on':''}"><span class="pill">${ic(k,22)}</span>${l}</a>`).join('')}<i class="home-ind"></i></nav>`;
}
function areaRow(a,compact){
  const [n,k,v]=a;
  return `<div style="display:grid;grid-template-columns:${compact?'86px':'96px'} 1fr 44px;align-items:center;gap:12px;height:${compact?30:34}px">
    <span style="display:flex;align-items:center;gap:9px;font-weight:650;font-size:13.5px;color:var(--tx-2)"><i class="dot" style="background:var(--${k})"></i>${n}</span>
    <div class="bar"><i style="width:${v}%;background:var(--${k})"></i></div>
    <span class="num" style="text-align:right;font-size:15px">${v}<small style="font-size:11px;color:var(--tx-3)">%</small></span></div>`;
}
/* constância: 12 semanas */
function heat(cell=13,gap=4){
  const lv=[];let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let i=0;i<84;i++){
    if(i>=84-26){lv.push(i===83?2:1+Math.floor(rnd()*3.99));}
    else{const r=rnd();lv.push(r<.38?0:1+Math.floor(rnd()*3));}
  }
  const col=l=>['var(--track)','color-mix(in srgb,var(--act) 30%,transparent)','color-mix(in srgb,var(--act) 55%,transparent)','color-mix(in srgb,var(--act) 80%,transparent)','var(--act)'][l];
  let h=`<div style="display:grid;grid-template-rows:repeat(7,${cell}px);grid-auto-flow:column;grid-template-columns:repeat(12,1fr);gap:${gap}px">`;
  lv.forEach((l,i)=>h+=`<i style="border-radius:3.5px;background:${col(l)};${i===83?'box-shadow:0 0 0 1.5px var(--act-tx);':''}"></i>`);
  return h+'</div>';
}
function weekDots(sz=34){
  const d=['ter','qua','qui','sex','sáb','dom','seg'];
  return `<div style="display:flex;justify-content:space-between">${d.map((x,i)=>{
    const today=i===6;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
     <span style="width:${sz}px;height:${sz}px;border-radius:50%;display:grid;place-items:center;${today?'background:conic-gradient(var(--prog) 0 57%,var(--track) 0);':'background:linear-gradient(180deg,#FFC766,#EE8A2E);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px -3px rgba(238,138,46,.6);color:#3A2004'}">
     ${today?`<span style="width:${sz-7}px;height:${sz-7}px;border-radius:50%;background:var(--c1);display:grid;place-items:center">${flame(13)}</span>`:ic('check',sz*.48)}</span>
     <span style="font-size:11.5px;font-weight:700;color:${today?'var(--tx)':'var(--tx-3)'}">${x}</span></div>`}).join('')}</div>`;
}
function missions(compact){
  const m=[
    {t:'Responder 40 questões',v:34,T:40,xp:30,en:'jade',g:mico('study')},
    {t:'Acertar 5 em Cirurgia',v:3,T:5,xp:40,en:'violet',g:mico('target')},

function rankDisc(i){
  const g=['linear-gradient(160deg,#FFEFB5,#E2A12E 55%,#A86A0E)','linear-gradient(160deg,#FFFFFF,#BAC5CE 55%,#7D8A95)','linear-gradient(160deg,#F7CBA5,#C77D4C 55%,#874620)'][i];
  return `<span class="rk m" style="background:${g}">${i+1}</span>`;
}
function lrow(p,i,o={}){
  const rank=i<3?rankDisc(i):`<span class="rk">${i+1}</span>`;
  return `<div class="lrow ${p.you?'you':''}" style="${o.pad!=null?`padding:0 ${o.pad}px;gap:10px;`:''}${o.h?`height:${o.h}px;`:''}${o.cols?`grid-template-columns:${o.cols};`:''}">${rank}${av(p.a,o.av||42,{on:p.on,fire:p.fire})}
   <div style="min-width:0"><div class="nm">${p.you?'Marina Lopes':p.n}${p.you&&!o.pad?' <span style="font:700 11px Manrope;color:var(--act-tx);margin-left:4px">você</span>':''}</div><div class="sub">${p.p}</div></div>
   <span></span>
   <span class="x num">${fmt(p.x)}<small>XP</small></span></div>`;
}
