<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAlvo · Plantão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- tokens: escuro (tema principal) ---------- */
:root{
  --bg:#152229; --s1:#1B2C34; --s2:#22363F; --s3:#2B424C; --line:#2D4550; --line2:#3A5664;
  --tx:#E4EDF0; --tx2:#A6BAC3; --tx3:#8098A4;
  --act:#3DD68C; --act-ink:#052716; --act-edge:#1F9E62; --act-soft:rgba(61,214,140,.13);
  --gold:#FFC54D; --gold-tx:#FFCF6B; --gold-edge:#C98A12; --gold-soft:rgba(255,197,77,.13);
  --bad:#FF7B7B; --bad-soft:rgba(255,123,123,.12); --ok:#3DD68C; --ok-soft:rgba(61,214,140,.12);
  --ice:#7CC8F2;
  --cli:#62A8FF; --cir:#B391FF; --ped:#FF9B5E; --go:#F27DB6; --pre:#3FCFD2;
  --av0:#2B5A6B; --av1:#3F4C7E; --av2:#5E4775; --av3:#2F6450; --av4:#7A5634; --av5:#28597F; --av6:#6B3F55; --av7:#3D6168;
  --frame-shadow:0 30px 80px rgba(0,0,0,.45);
  --page:#0F1A1F; --page-tx:#C9D6DC;
  --card-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 2px 0 rgba(0,0,0,.18);
}
:root[data-theme="light"]{
  --bg:#E9EFF2; --s1:#F7FAFB; --s2:#EEF3F5; --s3:#DFE8EC; --line:#D3DEE3; --line2:#BFCFD7;
  --tx:#132229; --tx2:#455D69; --tx3:#5A717D;
  --act:#2BC67E; --act-ink:#04261A; --act-edge:#16935A; --act-soft:rgba(22,160,95,.12);
  --gold:#F0A81C; --gold-tx:#9A6200; --gold-edge:#B87A07; --gold-soft:rgba(240,168,28,.15);
  --bad:#D2433F; --bad-soft:rgba(210,67,63,.09); --ok:#13965A; --ok-soft:rgba(19,150,90,.10);
  --ice:#2F8FC8;
  --cli:#2B78D3; --cir:#7652DC; --ped:#C9601F; --go:#C4407F; --pre:#0E8E91;
  --av0:#BFE0EA; --av1:#CBD2F2; --av2:#DDCDEE; --av3:#C6E6D3; --av4:#F1D9BE; --av5:#BFD9EF; --av6:#EFCADB; --av7:#C5E1E3;
  --frame-shadow:0 30px 70px rgba(30,60,75,.18);
  --page:#DCE5EA; --page-tx:#2A3E48;
  --card-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 2px 0 rgba(20,50,65,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--page-tx);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s}
.h,h1,h2,h3{font-family:Nunito,Figtree,sans-serif;font-weight:900;letter-spacing:-.01em}
b{font-weight:700}

/* ---------- página ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 32px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .h{font-size:20px;color:var(--tx)}
.top .sw{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--tx2)}
.top .sw i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line2)}
.seg{margin-left:auto;display:flex;background:var(--s1);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.seg button{font:700 14px Figtree;color:var(--tx2);background:none;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--s3);color:var(--tx)}
.stage{padding:28px 32px 60px}
.row{display:flex;gap:48px;align-items:flex-start;margin-bottom:56px;width:max-content}
.lbl{font:800 13px Figtree;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:0 0 10px 4px}
.lbl em{font-style:normal;color:var(--tx3);font-weight:600;margin-left:8px;letter-spacing:0;text-transform:none}

/* ---------- moldura ---------- */
.desk{width:1440px;height:900px;display:grid;grid-template-columns:248px 1fr;background:var(--bg);color:var(--tx);border-radius:14px;overflow:hidden;box-shadow:var(--frame-shadow);border:1px solid var(--line)}
.mob{width:390px;height:844px;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);border-radius:46px;overflow:hidden;box-shadow:var(--frame-shadow);border:1px solid var(--line);position:relative}

/* ---------- menu lateral ---------- */
.side{border-right:1.5px solid var(--line);padding:26px 16px 18px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;font:900 24px Nunito;color:var(--tx);padding:0 10px 22px}
.logo span{color:var(--act)}
.nav{display:flex;align-items:center;gap:14px;padding:0 14px;height:50px;border-radius:14px;font:800 14px Figtree;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);border:2px solid transparent}
.nav.on{background:var(--act-soft);border-color:color-mix(in srgb,var(--act) 55%,transparent);color:var(--act)}
:root[data-theme="light"] .nav.on{color:#0D7A47}
.nav svg{flex:none}
.side .me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--s1);border:1.5px solid var(--line)}
.side .me b{display:block;font-size:14px}
.side .me small{color:var(--tx3);font-size:12.5px;font-weight:600}
.pro{font:800 10.5px Figtree;letter-spacing:.06em;color:var(--act-ink);background:var(--gold);padding:2px 6px;border-radius:6px;margin-left:auto}

/* ---------- corpo desktop ---------- */
.body{display:grid;grid-template-columns:1fr 360px;gap:28px;padding:26px 32px 0 32px;overflow:hidden;min-width:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--s1);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--card-shadow)}
.card h2{font-size:19px;color:var(--tx)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch .r{margin-left:auto;font:700 13px Figtree;color:var(--tx2);display:flex;align-items:center;gap:6px}
.link{font:800 13px Figtree;letter-spacing:.04em;text-transform:uppercase;color:var(--act)}
:root[data-theme="light"] .link{color:#0F8150}
.kick{font:600 14px Figtree;color:var(--tx2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:14px;background:var(--act);color:var(--act-ink);font:800 15px Figtree;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--act-edge);border:0}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;background:var(--s1);color:var(--tx);font:800 14px Figtree;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--line2);box-shadow:0 3px 0 var(--line2)}

/* stats */
.stats{display:flex;align-items:center;gap:6px}
.st{display:flex;align-items:center;gap:7px;height:44px;padding:0 12px;border-radius:12px;font:900 16px Nunito;color:var(--tx)}
.st.f b{color:#FF9F3D} .st.x b{color:var(--gold-tx)} .st.d b{color:var(--gold-tx)}
:root[data-theme="light"] .st.f b{color:#C55A00}

/* avatar */
.av{position:relative;display:inline-block;flex:none;line-height:0}
.av svg.face{border-radius:50%;display:block}
.av .ring{position:absolute;inset:-3px;border-radius:50%;border:2.5px solid var(--gold)}
.av .on{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:11px;min-height:11px;max-width:22px;max-height:22px;border-radius:50%;background:var(--act);border:2.5px solid var(--bgc,var(--s1))}
.av .selo{position:absolute;right:-6px;top:-5px;width:42%;height:42%;min-width:18px;min-height:18px;max-width:30px;max-height:30px;border-radius:50%;background:var(--s2);border:2px solid var(--bgc,var(--s1));display:grid;place-items:center}
.av .selo svg{width:68%;height:68%}
.ini{display:grid;place-items:center;border-radius:50%;font:900 Nunito;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}

/* bars */
.bar{height:10px;border-radius:6px;background:var(--s3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;position:relative}
.bar i::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.28)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* início */
.hello h1{font-size:34px;line-height:1.1;margin-top:4px}
.plan{display:grid;grid-template-columns:168px 1fr;gap:30px;align-items:center;padding:28px 28px}
.ringbox{position:relative;width:168px;height:168px}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .c b{font:900 40px Nunito;line-height:1}
.ringbox .c small{font:700 13px Figtree;color:var(--tx2);margin-top:4px}
.steps{display:flex;flex-direction:column;gap:2px;margin:6px 0 18px}
.step{display:flex;align-items:center;gap:14px;height:52px;padding:0 14px;border-radius:14px}
.step.now{background:var(--s2);border:1.5px solid var(--line2)}
.step .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.step .ic.done{background:var(--act);color:var(--act-ink)}
.step .ic.cur{border:3px solid var(--gold);background:var(--gold-soft)}
.step .ic.next{border:2.5px solid var(--line2)}
.step .t{font:700 15.5px Figtree}
.step.done .t{color:var(--tx2)}
.step .m{margin-left:auto;font:700 14px Figtree;color:var(--tx2);display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font:800 11.5px Figtree;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:var(--s2);color:var(--tx2);border:1px solid var(--line)}
.arow{display:grid;grid-template-columns:118px 1fr 46px 44px;align-items:center;gap:12px;height:44px}
.arow .n{display:flex;align-items:center;gap:9px;font:700 15px Figtree}
.arow .p{font:900 17px Nunito;text-align:right}
.arow .d{font:700 12.5px Figtree;color:var(--ok);text-align:right}
.arow .d.neg{color:var(--bad)}
.big{font:900 46px Nunito;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 12px Figtree;color:var(--tx3)}
.wd i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:2px solid var(--line)}
.wd.ok i{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 60%,transparent)}
.wd.today i{border:2.5px solid var(--gold);background:var(--gold)}
.wd.today{color:var(--gold-tx)}
.wd.frz i{border-color:color-mix(in srgb,var(--ice) 60%,transparent);background:color-mix(in srgb,var(--ice) 14%,transparent)}
.heat{display:grid;grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;height:150px}
.heat i{border-radius:3px;background:var(--s3)}
.ms{display:flex;align-items:center;gap:14px;padding:10px 0}
.ms+.ms{border-top:1.5px solid var(--line)}
.ms .t{font:700 15px Figtree;margin-bottom:8px}
.ms .bar{height:14px;border-radius:8px}
.ms .bar i{background:linear-gradient(180deg,#FFD978,var(--gold));border-radius:8px}
.ms .mb{display:flex;align-items:center;gap:10px}.ms .mb .bar{flex:1}.ms .mb span{font:800 13px Figtree;color:var(--tx2);min-width:40px;text-align:right}
.ms .bar.full i{background:linear-gradient(180deg,#6BE3A8,var(--act))}

/* liga */
.lr{display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;border-radius:14px;--bgc:var(--bg)}
.lr .rk{width:28px;text-align:center;font:900 17px Nunito;color:var(--tx2);flex:none}
.lr .nm{min-width:0;flex:1}
.lr .nm b{display:block;font:700 16px Figtree;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .nm small{font:600 12.5px Figtree;color:var(--tx3)}
.lr .xp{font:800 15px Figtree;color:var(--tx2);flex:none}
.lr.up .rk{color:var(--ok)}
.lr.down .rk{color:var(--bad)}
.lr.you{background:var(--s2);border:1.5px solid var(--line2)}
.lr:hover{background:var(--s1)}
.medal{width:28px;height:28px;flex:none}
.zone{display:flex;align-items:center;gap:10px;font:800 12.5px Figtree;letter-spacing:.07em;text-transform:uppercase;margin:6px 0;height:28px}
.zone::before,.zone::after{content:"";flex:1;height:2px;border-radius:2px}
.zone.up{color:var(--ok)} .zone.up::before,.zone.up::after{background:color-mix(in srgb,var(--ok) 45%,transparent)}
.zone.down{color:var(--bad)} .zone.down::before,.zone.down::after{background:color-mix(in srgb,var(--bad) 45%,transparent)}
.gap{display:flex;align-items:center;justify-content:center;gap:8px;height:36px;font:700 13.5px Figtree;color:var(--tx3);border:1.5px dashed var(--line2);border-radius:12px;margin:4px 14px}
.divs{display:flex;align-items:flex-end;justify-content:center;gap:34px;padding:4px 0 6px}
.divs .dv{display:flex;flex-direction:column;align-items:center;gap:8px;font:800 12.5px Figtree;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3)}
.divs .dv.cur{color:var(--gold-tx)}
.divs .dv.cur svg{filter:drop-shadow(0 6px 18px rgba(255,190,60,.38))}
.pin{border-top:1.5px solid var(--line);background:var(--bg);padding:10px 0 14px}
.timer{display:inline-flex;align-items:center;gap:7px;font:800 14px Figtree;color:var(--gold-tx)}

/* perfil */
.ptop{display:flex;gap:24px;align-items:center;padding:24px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:10px;background:var(--s2);border:1.5px solid var(--line);font:700 13.5px Figtree;color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--s1)}
.tile b{display:block;font:900 22px Nunito;line-height:1.05}
.tile small{font:600 13px Figtree;color:var(--tx2)}
.meds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.md{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:700 13px Figtree;line-height:1.25}
.md small{font:600 12px Figtree;color:var(--tx3)}
.md.lock{color:var(--tx3)}
.cmp{display:grid;grid-template-columns:110px 1fr 40px;gap:4px 12px;align-items:center}
.cmp .n{display:flex;align-items:center;gap:8px;font:700 14.5px Figtree;grid-row:span 2}
.cmp .bar{height:9px}
.cmp .v{font:800 13.5px Figtree;text-align:right}
.cmp .v.me{color:var(--tx3);font-weight:700}
.cmp .bar.me i{opacity:.4}

/* questão */
.qtop{display:flex;align-items:center;gap:16px;height:44px}
.qbar{flex:1;height:14px;border-radius:8px;background:var(--s3);overflow:hidden}
.qbar i{display:block;height:100%;width:70%;border-radius:8px;background:linear-gradient(180deg,#FFD978,var(--gold))}
.qtx{font:500 16.5px/1.6 Figtree;color:var(--tx)}
.op{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--s1);box-shadow:0 2px 0 var(--line);font:500 15.5px/1.4 Figtree}
.op .lt{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:900 15px Nunito;border:2px solid var(--line2);color:var(--tx2);flex:none}
.op .pc{margin-left:auto;font:700 13px Figtree;color:var(--tx3);flex:none;padding-left:10px}
.op.ok{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 2px 0 color-mix(in srgb,var(--ok) 60%,transparent)}
.op.ok .lt{background:var(--ok);border-color:var(--ok);color:var(--act-ink)}
.op.ok .pc{color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 2px 0 color-mix(in srgb,var(--bad) 55%,transparent)}
.op.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.op.bad .pc{color:var(--bad)}
.op.dim{color:var(--tx2)}
.gab{border-radius:16px;border:1.5px solid var(--line);background:var(--s1);padding:16px 18px}
.gab h3{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gab p{font:500 15px/1.6 Figtree;color:var(--tx)}
.gab p+p{margin-top:10px}
.gab p b{font-weight:800}
.abar{display:flex;align-items:center;gap:8px;border-top:1.5px solid var(--line);background:var(--bg);padding:14px 0 16px}
.ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line2);background:var(--s1);box-shadow:0 3px 0 var(--line2);flex:none}
.grid20{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid20 i{height:42px;border-radius:11px;display:grid;place-items:center;font:900 15px Nunito;font-style:normal;background:var(--s2);color:var(--tx3);border:1.5px solid var(--line)}
.grid20 i.c{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.grid20 i.w{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.grid20 i.k{background:var(--s3);color:var(--tx2)}
.grid20 i.now{border:2.5px solid var(--gold);color:var(--tx)}
.curo-chip{display:flex;align-items:center;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--s2);font:700 14.5px Figtree}

/* ---------- celular ---------- */
.sb{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;font:700 15px Figtree;color:var(--tx)}
.sb .ic{display:flex;gap:6px;align-items:center}
.mc{flex:1;overflow:hidden;padding:6px 16px 0;display:flex;flex-direction:column;gap:12px;min-height:0}
.tabs{flex:none;height:84px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1.5px solid var(--line);background:var(--bg);padding:6px 6px 0;position:relative}
.tabs::after{content:"";position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--tx);opacity:.85}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font:800 10.5px Figtree;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);border-radius:12px;height:54px;justify-content:center;border:2px solid transparent;margin:0 3px}
.tb.on{color:var(--act);background:var(--act-soft);border-color:color-mix(in srgb,var(--act) 50%,transparent)}
:root[data-theme="light"] .tb.on{color:#0D7A47}
.mob .card{padding:14px 16px;border-radius:16px}
.mob .card h2{font-size:17px}
.mob .btn{height:50px;width:100%}
.mob .lr{height:44px;padding:0 10px;gap:12px}
.mob .lr .nm b{font-size:15px}
.mob .zone{margin:2px 0}
.mob .op{min-height:50px;padding:8px 12px;gap:12px;font-size:14.5px}
.mob .qtx{font-size:15.5px;line-height:1.55}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--tx);opacity:.85}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <clipPath id="avc" clipPathUnits="userSpaceOnUse"><circle cx="32" cy="32" r="32"/></clipPath>
  <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF5F1F"/><stop offset=".55" stop-color="#FF9A2E"/><stop offset="1" stop-color="#FFC94A"/></linearGradient>
  <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#F2A81D"/></linearGradient>
